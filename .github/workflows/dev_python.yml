# CI/CD environment DEV (branch `main`) — API Python (sinyal trading & rekomendasi).
#
#   Pull request ke main  -> CI saja: lint + smoke test API + audit dependency + cek Dockerfile bisa
#                            di-build. Tidak ada yang di-push/deploy — PR gagal = jangan di-merge.
#   Push / merge ke main   -> CI, lalu build image & push ke GHCR (ghcr.io), lalu deploy ke VPS
#                            dev lewat SSH (docker compose pull + up).
#
# Hanya berjalan kalau kode backend berubah (main.py, src/, Dockerfile, ...). Perubahan notebooks/
# atau docs/ tidak memicu build/deploy.
#
# Secrets yang wajib diisi di repo INI (Settings -> Secrets and variables -> Actions). Nilai SSH sama
# dengan repo backend Rust karena VPS-nya sama:
#   DEV_VPS_HOST      IP / hostname VPS dev
#   DEV_VPS_USER      user SSH di VPS (mis. root / deploy)
#   DEV_VPS_SSH_KEY   private key SSH (isi file id_ed25519, termasuk baris BEGIN/END)
#   DEV_VPS_PORT      port SSH (opsional, default 22)
#   DEV_VPS_APP_DIR   folder API Python dev di VPS, berisi .env.docker (mis. /root/app/backtes-crypto-dev)
# Push ke GHCR memakai GITHUB_TOKEN bawaan — tidak perlu secret tambahan.

name: Dev - Python CI/CD

on:
  push:
    branches: ["main"]
    paths:
      - "main.py"
      - "src/**"
      - "requirements-api.txt"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - ".github/workflows/dev_python.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "main.py"
      - "src/**"
      - "requirements-api.txt"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - ".github/workflows/dev_python.yml"
  workflow_dispatch:

# Push beruntun ke main -> run lama dibatalkan, hanya yang terbaru yang dideploy.
concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/bauagg/backtes-crypto-python
  PYTHON_VERSION: "3.13"

jobs:
  # -------------------------------------------------------------------------------------------
  # 1. CI: lint, smoke test (tanpa DB), audit keamanan dependency.
  # -------------------------------------------------------------------------------------------
  check:
    name: Lint & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install dependency runtime
        # httpx2 = client HTTP untuk TestClient Starlette (khusus tes, tidak ikut image Docker).
        run: pip install -r requirements-api.txt ruff pip-audit httpx2

      # Error fatal saja (syntax error, nama tidak terdefinisi) — gaya tidak menggagalkan build.
      - name: Lint (ruff)
        run: ruff check main.py src --select E9,F63,F7,F82 --output-format github

      # Tanpa DB: TestClient tanpa `with` tidak menjalankan lifespan (ping DB), jadi yang dites adalah
      # semua jalur yang berhenti SEBELUM query: auth API key, validasi body/query, health.
      - name: Smoke test API
        env:
          API_KEY: ci-test-key
          ENABLE_DOCS: "false"
        run: |
          python - <<'EOF'
          from fastapi.testclient import TestClient
          import main

          c = TestClient(main.app, raise_server_exceptions=False)
          H = {"X-API-Key": "ci-test-key"}
          cases = [
              ("tanpa API key -> 401", c.get("/recommendations/momentum").status_code, 401),
              ("API key salah -> 401", c.post("/signal", json={"modal": 1}, headers={"X-API-Key": "x"}).status_code, 401),
              ("modal 0 -> 422", c.post("/signal", json={"modal": 0}, headers=H).status_code, 422),
              ("modal Infinity -> 422", c.post("/signal", json={"modal": "Infinity"}, headers=H).status_code, 422),
              ("qty negatif -> 422", c.post("/signal", json={"modal": 1e6, "posisi": {"BTCUSDT": -1}}, headers=H).status_code, 422),
              ("simbol aneh -> 422", c.post("/signal", json={"modal": 1e6, "posisi": {"x;drop": 1}}, headers=H).status_code, 422),
              ("tanggal salah -> 422", c.get("/recommendations/momentum?date=abc", headers=H).status_code, 422),
              ("limit 4 -> 422", c.get("/recommendations/momentum?limit=4", headers=H).status_code, 422),
              ("docs mati -> 404", c.get("/docs").status_code, 404),
          ]
          failed = [name for name, got, want in cases if got != want]
          for name, got, want in cases:
              print(("OK  " if got == want else "GAGAL"), name, f"(dapat {got})")
          raise SystemExit(f"{len(failed)} smoke test gagal: {failed}" if failed else 0)
          EOF

      # CVE di dependency runtime ditampilkan di log, tidak menggagalkan build (sama seperti clippy
      # di repo Rust). Perbaiki dengan menaikkan versi minimum di requirements-api.txt.
      - name: Audit dependency (informasi)
        run: pip-audit -r requirements-api.txt || echo "::warning::pip-audit menemukan CVE — cek log di atas"

  # -------------------------------------------------------------------------------------------
  # 2. Build image Docker. PR: hanya dicek bisa di-build. Push ke main: di-push ke GHCR.
  # -------------------------------------------------------------------------------------------
  image:
    name: Docker image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag image
        id: meta
        run: echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:dev
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------------------------
  # 3. Deploy ke VPS dev (hanya push/merge ke main, bukan PR).
  # -------------------------------------------------------------------------------------------
  deploy:
    name: Deploy dev
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Cek secret SSH
        env:
          SSH_KEY: ${{ secrets.DEV_VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.DEV_VPS_HOST }}
          VPS_USER: ${{ secrets.DEV_VPS_USER }}
          APP_DIR: ${{ secrets.DEV_VPS_APP_DIR }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -n "$VPS_HOST" ] || fail "Secret DEV_VPS_HOST kosong / tidak ditemukan"
          [ -n "$VPS_USER" ] || fail "Secret DEV_VPS_USER kosong / tidak ditemukan"
          [ -n "$APP_DIR" ]  || fail "Secret DEV_VPS_APP_DIR kosong / tidak ditemukan"
          [ -n "$SSH_KEY" ]  || fail "Secret DEV_VPS_SSH_KEY kosong / tidak ditemukan (cek nama & tab Secrets -> Repository secrets)"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          head -1 "$RUNNER_TEMP/deploy_key" | grep -q -- "-----BEGIN" \
            || fail "DEV_VPS_SSH_KEY tidak diawali baris -----BEGIN OPENSSH PRIVATE KEY-----"
          grep -q -- "-----END" "$RUNNER_TEMP/deploy_key" \
            || fail "DEV_VPS_SSH_KEY tidak diakhiri baris -----END OPENSSH PRIVATE KEY-----"
          ssh-keygen -lf "$RUNNER_TEMP/deploy_key" \
            || fail "DEV_VPS_SSH_KEY bukan private key yang valid (mungkin yang disalin file .pub?)"
          rm -f "$RUNNER_TEMP/deploy_key"

      # docker-compose.yml selalu ikut versi terbaru di repo; .env.docker tetap di VPS (tidak
      # pernah disimpan di GitHub).
      - name: Kirim docker-compose.yml ke VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_VPS_HOST }}
          username: ${{ secrets.DEV_VPS_USER }}
          key: ${{ secrets.DEV_VPS_SSH_KEY }}
          port: ${{ secrets.DEV_VPS_PORT || 22 }}
          source: docker-compose.yml
          target: ${{ secrets.DEV_VPS_APP_DIR }}

      - name: Pull image & restart API
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ needs.image.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_DIR: ${{ secrets.DEV_VPS_APP_DIR }}
        with:
          host: ${{ secrets.DEV_VPS_HOST }}
          username: ${{ secrets.DEV_VPS_USER }}
          key: ${{ secrets.DEV_VPS_SSH_KEY }}
          port: ${{ secrets.DEV_VPS_PORT || 22 }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN,APP_DIR
          script: |
            set -e
            cd "$APP_DIR"
            test -f .env.docker || { echo ".env.docker belum ada di $APP_DIR"; exit 1; }
            # Variabel compose environment dev — container treding-api, port debug 127.0.0.1:8080.
            # Backend Rust dev memanggil http://treding-api:8080 lewat network data-net.
            printf 'IMAGE_TAG=%s\nCONTAINER_PREFIX=treding\nAPI_PORT_HOST=8080\n' "$IMAGE_TAG" > .env
            docker network inspect data-net >/dev/null 2>&1 || docker network create data-net
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull api
            docker compose up -d --no-build --remove-orphans
            docker logout ghcr.io
            docker image prune -f
            sleep 8
            docker compose ps
            docker compose logs --tail 30 api
            # Gagal deploy kalau API tidak menjawab /health.
            curl -fsS --retry 5 --retry-delay 3 --retry-all-errors http://127.0.0.1:8080/health
